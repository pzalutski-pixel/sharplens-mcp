name: Release to NuGet and npm

on:
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NuGet publishes the csproj <Version>; npm publishes the release tag. Fail the
      # release if they disagree so the two packages can never ship different versions.
      - name: Verify package version matches the release tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/SharpLensMcp.csproj)
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' (version '$TAG_VERSION') does not match src/SharpLensMcp.csproj <Version> '$CSPROJ_VERSION'. Bump the csproj version or fix the tag before releasing."
            exit 1
          fi
          echo "Version '$CSPROJ_VERSION' matches the release tag."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/SharpLensMcp.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg

  publish-nuget:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-npm:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing proves this job's identity to npm with GitHub's OIDC token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later; the one Node bundles may be older.
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11.17.0

      # npm accepts this publish through trusted publishing: the package's settings on npmjs.com trust this
      # repository's release.yml, and the job proves who it is with GitHub's OIDC token, so no npm token is stored.
      - name: Publish to npm
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public
